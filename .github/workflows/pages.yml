name: Test and deploy Sugun Games

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Test game rules
        run: npm test
      - name: Package public files
        run: |
          mkdir _site
          cp index.html arcade.css echo.html style.css game.js engine.js levels.js icon.svg snake.html snake.css snake.js snake-engine.js _site/
          cp bricks.html bricks.css bricks.js bricks-engine.js race.html race.css race.js race-engine.js race-network.js _site/
          cp bumper.html bumper.css bumper.js bumper-engine.js doodle.html doodle.css doodle.js doodle-engine.js room-network.js _site/
          mkdir _site/vendor
          cp vendor/peerjs.min.js vendor/peerjs.LICENSE _site/vendor/
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: test-and-package
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
